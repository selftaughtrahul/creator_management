{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Awisee{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="marketing">
  <header class="nav-lite">
    <a class="brand-lockup" href="{% url 'accounts:home' %}"><span class="brand-mark">A</span> Awisee</a>
    <nav>
      <a href="{% url 'accounts:privacy' %}">Privacy</a>
      <a href="{% url 'account_login' %}">Log in</a>
    </nav>
  </header>
  <main class="legal">
    <h1>{% block heading %}{% endblock %}</h1>
    {% block legal %}{% endblock %}
  </main>
  <footer class="footer-lite">
    <a href="{% url 'accounts:home' %}">Awisee</a>
    <a href="{% url 'accounts:data_deletion' %}">Data deletion</a>
  </footer>
</body>
</html>
